#
# 3dspeex: play through the USB sound card named by
# 85-usb-audio-default.rules. "dmix" lets several programs share the
# card (without it, one program holds it and the rest wait); "plug"
# converts sample rate and channels, so mono speech works on stereo
# devices. ipc_perm lets programs run by different users mix together.
pcm.!default {
    type plug
    slave.pcm "usbaudio_mix"
}
pcm.usbaudio_mix {
    type dmix
    ipc_key 3544
    ipc_perm 0666
    slave.pcm "hw:CARD=usbaudio,DEV=0"
}
ctl.!default {
    type hw
    card usbaudio
}
