#
# 3dspeex: play through the USB sound card named by
# 85-usb-audio-default.rules. "plug" converts sample rate and channels,
# so mono speech works on stereo devices.
pcm.!default {
    type plug
    slave.pcm "hw:CARD=usbaudio,DEV=0"
}
ctl.!default {
    type hw
    card usbaudio
}
