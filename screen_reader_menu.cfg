# 3dspeex - a "Screen reader" menu on the printer's display, for the
# speech settings. Changes are heard at once and saved (see README.md).
# https://github.com/daiverd/3dspeex
#
# install.sh links this file into the config folder and includes it from
# screen_reader.cfg. It is part of the repo, so to change it, copy it to
# another name and include that instead.

[menu __main __screen_reader]
type: list
name: Screen reader

[menu __main __screen_reader __rate]
type: input
name: Rate: {'%d' % menu.input}
input: {printer.screen_reader.rate}
input_min: 80
input_max: 500
input_step: 10
realtime: True
gcode: SCREEN_READER_SET RATE={'%d' % menu.input}

[menu __main __screen_reader __volume]
type: input
enable: {printer.screen_reader.volume >= 0}
name: Volume: {'%d' % menu.input}%
input: {printer.screen_reader.volume}
input_min: 10
input_max: 100
input_step: 10
realtime: True
gcode: SCREEN_READER_SET VOLUME={'%d' % menu.input}

# Shown instead when the sound card has no volume control 3dspeex can
# find (see mixer_control in README.md)
[menu __main __screen_reader __no_volume]
type: command
enable: {printer.screen_reader.volume < 0}
name: Volume: not available

# Only shown with two or more voices in [screen_reader] voices:
[menu __main __screen_reader __voice]
type: input
enable: {printer.screen_reader.voices|length > 1}
name: Voice: {printer.screen_reader.voices[menu.input|int]}
input: {printer.screen_reader.voice_index}
input_min: 0
input_max: {printer.screen_reader.voices|length - 1}
input_step: 1
realtime: True
gcode: SCREEN_READER_SET VOICE={printer.screen_reader.voices[menu.input|int]}

[menu __main __screen_reader __progress]
type: input
name: Speak progress: {'off' if menu.input == 0 else 'every %d%%' % printer.screen_reader.progress_steps[menu.input|int]}
input: {printer.screen_reader.progress_index}
input_min: 0
input_max: {printer.screen_reader.progress_steps|length - 1}
input_step: 1
realtime: True
gcode: SCREEN_READER_SET PROGRESS_STEP={printer.screen_reader.progress_steps[menu.input|int]}

[menu __main __screen_reader __info]
type: input
name: Info lines: {'on' if menu.input else 'off'}
input: {printer.screen_reader.announce_info|int}
input_min: 0
input_max: 1
input_step: 1
realtime: True
gcode: SCREEN_READER_SET ANNOUNCE_INFO={'%d' % menu.input}

[menu __main __screen_reader __reset]
type: command
name: Reset to config
gcode: SCREEN_READER_SET RESET=1
